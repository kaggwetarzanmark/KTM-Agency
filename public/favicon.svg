<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Red rounded square -->
  <rect width="32" height="32" rx="7" fill="#D93225"/>
  <!-- Subtle inner gradient for depth -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- K lettermark — vertical bar -->
  <rect x="8" y="7" width="4.5" height="18" rx="1.5" fill="#fff"/>
  <!-- K top-right arm -->
  <polygon points="13,16 22,7 18,7 10.5,15" fill="#fff"/>
  <!-- K bottom-right arm (with diagonal cut) -->
  <polygon points="13,16 22,25 18,25 10.5,17" fill="#fff"/>
</svg>
